# Ajustes de PostgreSQL para Raspberry Pi 5 con 16 GB de RAM.
# Los valores dejan margen para los contenedores de datos e IA.

listen_addresses = '*'
max_connections = 50

# Memoria: ~25 % de la RAM asignada al contenedor de la base (2 GB)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Escritura
wal_buffers = 16MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# Consultas
random_page_cost = 1.1        # SSD NVMe, no disco mecánico
effective_io_concurrency = 200

# Registro (auditoría del punto 3 del anexo de ética)
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] user=%u db=%d '
