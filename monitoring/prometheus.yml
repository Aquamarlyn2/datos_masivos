global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: api-inferencia
    static_configs:
      - targets: ["api:8000"]

  - job_name: jupyter
    static_configs:
      - targets: ["jupyter:8888"]
    metrics_path: /metrics

  - job_name: host-raspberry
    static_configs:
      - targets: ["node-exporter:9100"]
