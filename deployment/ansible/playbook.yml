---
# Aprovisionamiento del host Raspberry Pi 5.
- name: Preparar Raspberry Pi 5 para microservicios de datos e IA
  hosts: raspberry
  become: true

  tasks:
    - name: Actualizar paquetes
      apt:
        update_cache: true
        upgrade: full

    - name: Instalar paquetes base
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - git
          - curl
          - jq
        state: present

    - name: Habilitar cgroups de memoria
      lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: 'cgroup_enable=memory'
        line: "{{ lookup('file', '/boot/firmware/cmdline.txt') }} cgroup_enable=memory cgroup_memory=1"
        state: present

    - name: Parámetros del kernel
      copy:
        dest: /etc/sysctl.d/99-datos-masivos.conf
        content: |
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 2048
          vm.swappiness = 10
          fs.file-max = 2097152

    - name: Aplicar parámetros
      command: sysctl --system

    - name: Cortafuegos con deny por defecto
      ufw:
        default: deny
        direction: incoming

    - name: Permitir SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Activar cortafuegos
      ufw:
        state: enabled

    - name: Endurecer SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
      notify: Reiniciar SSH

  handlers:
    - name: Reiniciar SSH
      service:
        name: ssh
        state: restarted
